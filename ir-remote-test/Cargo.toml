[package]
name = "ir-remote-test"
description = "IR remote test screen: shows every key the @sgc seat delivers, with an optional raw-evdev read-back"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project (no workspace): slint comes from the fork as a git
# dependency, and the crate opts out of any enclosing workspace.
[workspace]

# GPU only: femtovg over gbm/EGL, i.e. the board's Mali GPU (panfrost). The
# software renderer is deliberately NOT compiled in - the fork's linuxsgc
# backend survives a lease revoke on the GL path (it drops and rebuilds its
# EGL/GBM stack on the fresh lease fd), so a CPU fallback buys nothing here and
# would only hide a broken GL userspace behind a slow screen.
#
# `input` is in default on purpose, unlike the dashboards: this app exists to
# consume the @sgc-granted devices, so a build without it would hold the lease
# and receive nothing. Devices arrive through libinput inside the linuxsgc
# backend (backend-linuxsgc-libinput). gnu/glibc only - a static musl build
# cannot link libinput.
[features]
default = ["femtovg", "input"]
femtovg = ["slint/renderer-femtovg"]
input = ["slint/backend-linuxsgc-libinput"]

[dependencies]
slint = { git = "https://github.com/lulkien/slint.git", branch = "dev/1.18-sgc", default-features = false, features = [
    "std",
    "backend-linuxsgc",
    "compat-1-18",
    "unstable-fontique-011",
] }
anyhow = "1"
# Levels follow RUST_LOG (default `info`): one line per delivered key, which is
# rare enough to keep at `info`. env_logger without its default features: no
# timestamps or colour of its own, and systemd stamps the journal anyway.
log = "0.4"
env_logger = { version = "0.11", default-features = false }

# Compiles ui/main.slint to Rust; same fork rev as the runtime dependency above.
[build-dependencies]
slint-build = { git = "https://github.com/lulkien/slint.git", branch = "dev/1.18-sgc" }

[profile.release]
strip = true
